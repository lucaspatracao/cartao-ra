<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartão Profissional em RA — Lucas Patracão</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>
    <a-scene mindar-image="imageTargetSrc: ./assets/targets/targets.mind; autoStart: true;" embedded color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: true">
        <a-assets>
            <!-- fontes/imagens auxiliares, se houver -->
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0" id="card-target">
            <!-- Bloco 1: identificação -->
            <a-text value="Lucas Nunes Patracao\nTecnologo em ADS" color="#FFFFFF" align="center" position="0 0.3 0"
                scale="0.5 0.5 0.5"></a-text>

            <!-- Bloco 2: skills -->
            <a-text value="JS | React Native | Node.js" color="#58A6FF" align="center" position="0 0 0"
                scale="0.4 0.4 0.4"></a-text>

            <!-- Bloco 3: contato -->
            <a-text value="github.com/lucaspatracao" color="#8B949E" align="center" position="0 -0.3 0"
                scale="0.35 0.35 0.35"></a-text>
        </a-entity>
    </a-scene>
</body>

</html>
